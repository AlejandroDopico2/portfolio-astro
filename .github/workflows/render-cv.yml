name: Render CV

on:
  push:
    branches: [main]
    paths:
      - cv/Alejandro_Dopico-Castro_CV.yaml
      - cv/requirements.txt
      - .github/workflows/render-cv.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install RenderCV
        run: pip install -r cv/requirements.txt

      - name: Generate PDF
        run: |
          mkdir -p public/cv
          rendercv render cv/Alejandro_Dopico-Castro_CV.yaml --pdf-path cv/cv.pdf
          cp cv/cv.pdf public/cv/cv.pdf

      - name: Commit PDF if it changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cv/cv.pdf public/cv/cv.pdf
          if git diff --staged --quiet; then
            echo 'PDF unchanged'
            exit 0
          fi
          git commit -m 'chore(cv): regenerate PDF'
          git push
